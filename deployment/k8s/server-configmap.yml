apiVersion: v1
kind: ConfigMap
metadata:
  name: my-configmap
data:
  NODE_ENV: production
  PORT: "9999"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PAIR_TTL: "20"
  WEATHER_URL: "https://api.api-ninjas.com/v1/weather"
  CACHE_MAX_AGE: "300"
  CACHE_TIMEOUT_MS: "300"
  PROVIDER_TIMEOUT_MS: "1500"
  BREAKER_THRESHOLD: "3"
  BREAKER_COOLDOWN_MS: "10000"
  DEMO_FAULTS: "false"
