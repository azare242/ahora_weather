services:
  app:
    build:
      context: ../weather_server
    image: ahora-weather:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-9999}:9999"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "9999"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PAIR_TTL: "${REDIS_PAIR_TTL:-20}"
      WEATHER_URL: "${WEATHER_URL:-}"
      WEATHER_AUTH: "${WEATHER_AUTH:-}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data
volumes:
  redis-data:
